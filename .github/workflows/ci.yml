name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
  PTAP_TEST_PG: postgresql://postgres:postgres@localhost:5432

jobs:
  test:
    # Needs the AWS bootstrap (CodeArtifact holds ptap-common); see ptap-infra/README.md
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ptap-github-read
          aws-region: ${{ env.AWS_REGION }}
      - name: Point pip at CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token --domain ptap --domain-owner "$ACCOUNT" --query authorizationToken --output text)
          echo "::add-mask::$TOKEN"
          URL="https://aws:${TOKEN}@ptap-${ACCOUNT}.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/ptap-python/simple/"
          echo "PIP_INDEX_URL=$URL" >> "$GITHUB_ENV"
          printf '%s' "$URL" > "$RUNNER_TEMP/pip_index_url"
      - run: pip install -e "./bff[test]"
      - run: pytest -q bff/tests

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: [test, ui]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ptap-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Point pip at CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token --domain ptap --domain-owner "$ACCOUNT" --query authorizationToken --output text)
          echo "::add-mask::$TOKEN"
          URL="https://aws:${TOKEN}@ptap-${ACCOUNT}.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/ptap-python/simple/"
          echo "PIP_INDEX_URL=$URL" >> "$GITHUB_ENV"
          printf '%s' "$URL" > "$RUNNER_TEMP/pip_index_url"
      - run: mkdir -p "$RUNNER_TEMP/wheels"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          build-contexts: wheels=${{ runner.temp }}/wheels
          secret-files: pip_index_url=${{ runner.temp }}/pip_index_url
          tags: |
            ${{ steps.ecr.outputs.registry }}/ptap-workbench:latest
            ${{ steps.ecr.outputs.registry }}/ptap-workbench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll the ECS service
        run: |
          if aws ecs describe-services --cluster ptap-dev --services workbench --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q workbench; then
            aws ecs update-service --cluster ptap-dev --service workbench --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster ptap-dev --services workbench
            echo "workbench is running ${{ github.sha }}"
          else
            echo "ECS service workbench not found yet (run infra-apply in ptap-infra first); image pushed only."
          fi
